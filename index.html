<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cẩm nang toàn năng - MẫnKaka</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <h1>Cẩm nang toàn năng</h1>
                <span class="badge">MẫnKaka</span>
            </div>
            <p class="subtitle">📌 Tổng hợp công cụ · AI · Website hữu ích</p>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="container">

        <!-- ===== DANH MỤC: CÔNG CỤ AI ===== -->
        <section class="category">
            <div class="category-header">
                <span class="cat-icon">🤖</span>
                <h2>Trợ lý AI</h2>
                <span class="count">4</span>
            </div>
            <div class="card-grid" id="aiGrid"></div>
        </section>

        <!-- ===== DANH MỤC: CÔNG CỤ LẬP TRÌNH ===== -->
        <section class="category">
            <div class="category-header">
                <span class="cat-icon">💻</span>
                <h2>Công cụ lập trình</h2>
                <span class="count">4</span>
            </div>
            <div class="card-grid" id="devGrid"></div>
        </section>

        <!-- ===== DANH MỤC: HỌC TẬP & TRA CỨU ===== -->
        <section class="category">
            <div class="category-header">
                <span class="cat-icon">📚</span>
                <h2>Học tập & Tra cứu</h2>
                <span class="count">4</span>
            </div>
            <div class="card-grid" id="learnGrid"></div>
        </section>

        <!-- ===== DANH MỤC: CÔNG CỤ VĂN PHÒNG ===== -->
        <section class="category">
            <div class="category-header">
                <span class="cat-icon">📝</span>
                <h2>Công cụ văn phòng</h2>
                <span class="count">4</span>
            </div>
            <div class="card-grid" id="officeGrid"></div>
        </section>

        <!-- ===== DANH MỤC: GIẢI TRÍ ===== -->
        <section class="category">
            <div class="category-header">
                <span class="cat-icon">🎵</span>
                <h2>Giải trí & Đọc báo</h2>
                <span class="count">4</span>
            </div>
            <div class="card-grid" id="funGrid"></div>
        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 <strong>Cẩm nang toàn năng</strong> · MẫnKaka</p>
            <p class="footer-small">📌 Click vào thẻ để mở link trong tab mới</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
